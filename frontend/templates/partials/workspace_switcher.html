{# Horizontal workspace switcher for top command bar — preserves POST /switch-interface #}
<nav class="aica-ws" aria-label="AICA workspaces">
    {% if current_workspace != 'pos' %}
    <form method="POST" action="/switch-interface" class="sidebar-switch-form aica-ws-form">
        <input type="hidden" name="target" value="pos">
        <button type="submit" class="aica-ws-btn" data-i18n="nav.switchToPos" title="PoS">
            <i class="bi bi-cart-check-fill"></i><span>PoS</span>
        </button>
    </form>
    {% else %}
    <div class="aica-ws-btn is-active" aria-current="page">
        <i class="bi bi-cart-check-fill"></i><span data-i18n="iface.posTitle">PoS</span>
    </div>
    {% endif %}

    {% if current_workspace != 'weigh' %}
    <form method="POST" action="/switch-interface" class="sidebar-switch-form aica-ws-form">
        <input type="hidden" name="target" value="weigh">
        <button type="submit" class="aica-ws-btn" data-i18n="nav.switchToWeigh" title="Weigh & QR">
            <i class="bi bi-qr-code"></i><span>Weigh</span>
        </button>
    </form>
    {% else %}
    <div class="aica-ws-btn is-active" aria-current="page">
        <i class="bi bi-qr-code"></i><span data-i18n="nav.weigh">Weigh</span>
    </div>
    {% endif %}

    {% if current_workspace != 'org' %}
    <form method="POST" action="/switch-interface" class="sidebar-switch-form aica-ws-form">
        <input type="hidden" name="target" value="org">
        <button type="submit" class="aica-ws-btn" data-i18n="nav.switchToOrg" title="Organization">
            <i class="bi bi-building"></i><span>Org</span>
        </button>
    </form>
    {% else %}
    <div class="aica-ws-btn is-active" aria-current="page">
        <i class="bi bi-building"></i><span data-i18n="iface.orgTitleShort">Org</span>
    </div>
    {% endif %}
</nav>
