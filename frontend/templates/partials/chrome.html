{# Shared floating chrome: theme, language, IRA assistant #}
<link rel="stylesheet" href="/static/update.css?v=3">

<div id="aicaUpdateBanner" class="aica-update-banner" hidden role="dialog" aria-labelledby="aicaUpdateBannerTitle">
    <div id="aicaUpdateBannerTitle" class="aica-update-banner-title" data-i18n="update.bannerTitle">Update available</div>
    <div id="aicaUpdateBannerMeta" class="aica-update-banner-meta"></div>
    <div id="aicaUpdateBannerNotes" class="aica-update-banner-notes" hidden></div>
    <div id="aicaUpdateProgressWrap" class="aica-update-progress-wrap" hidden>
        <div class="aica-update-progress-label" id="aicaUpdateProgressLabel"></div>
        <div class="aica-update-progress-track" aria-hidden="true">
            <div class="aica-update-progress-bar" id="aicaUpdateProgressBar"></div>
        </div>
        <div class="aica-update-progress-detail" id="aicaUpdateProgressDetail"></div>
    </div>
    <div id="aicaUpdateReadyMsg" class="aica-update-ready-msg" hidden></div>
    <div class="aica-update-banner-actions" id="aicaUpdateBannerActions">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="aicaUpdateLaterBtn" data-i18n="update.later">Later</button>
        <button type="button" class="btn btn-primary btn-sm" id="aicaUpdateNowBtn" data-i18n="update.now">Update now</button>
        <button type="button" class="btn btn-outline-primary btn-sm" id="aicaUpdateRetryBtn" hidden data-i18n="update.retry">Retry</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="aicaUpdateCloseBtn" hidden data-i18n="update.close">Close</button>
        <button type="button" class="btn btn-primary btn-sm" id="aicaUpdateRestartBtn" hidden data-i18n="update.restart">Restart to update</button>
    </div>
    <div id="aicaUpdateInstallMsg" class="aica-update-install-msg" hidden></div>
</div>

<button type="button" class="aica-theme-toggle" id="aicaThemeToggle" data-i18n-title="assistant.theme" data-i18n-aria="assistant.theme" title="Toggle theme" aria-label="Toggle theme">
    <i class="bi bi-moon-fill" id="aicaThemeIcon"></i>
</button>

<div class="aica-lang-switch" id="aicaLangSwitch" data-i18n-title="assistant.language" title="Language">
    <select id="aicaLangSelect" aria-label="Language" class="aica-lang-select" data-i18n-aria="assistant.language">
        <option value="en" {% if preferred_language == 'en' %}selected{% endif %}>English</option>
        <option value="kn" {% if preferred_language == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
        <option value="hi" {% if preferred_language == 'hi' %}selected{% endif %}>हिन्दी</option>
    </select>
</div>

{# IRA ambient layer — inactive until wake / voice #}
<div id="iraOverlay" class="ira-overlay" hidden aria-hidden="true">
    <div class="ira-halo" aria-hidden="true"></div>
    <div class="ira-center" role="status" aria-live="polite">
        <div class="ira-orb" id="iraOrb">
            <span class="ira-orb-core"></span>
            <span class="ira-orb-ring"></span>
        </div>
        <div class="ira-center-copy">
            <div class="ira-name">IRA</div>
            <div class="ira-status-text" id="iraStatusText">Listening…</div>
        </div>
    </div>
</div>

<button type="button" class="aica-fab" id="aicaFab" data-i18n-title="assistant.open" data-i18n-aria="assistant.open" title="Open IRA" aria-label="Open IRA — Intelligent Revenue Assistant" aria-expanded="false">
    <i class="bi bi-stars"></i>
</button>

<div class="aica-chat" id="aicaChat" hidden>
    <div class="aica-chat-head">
        <div>
            <div class="aica-chat-title" data-i18n="assistant.title">IRA</div>
            <div class="aica-chat-sub" id="aicaChatContext" data-i18n="assistant.tagline">Intelligent Revenue Assistant</div>
        </div>
        <button type="button" class="aica-chat-close" id="aicaChatClose" data-i18n-aria="assistant.close" aria-label="Close IRA"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="aica-chat-body" id="aicaChatBody"></div>
    <div class="aica-chat-nav" id="aicaChatNav" hidden></div>
    <div class="aica-voice-status" id="aicaVoiceStatus" hidden></div>
    <form class="aica-chat-form" id="aicaChatForm">
        <button type="button" class="aica-mic-btn" id="aicaMicBtn" data-i18n-aria="assistant.micOff" data-i18n-title="assistant.micOff" aria-label="Voice" title="Voice">
            <i class="bi bi-mic" id="aicaMicIcon"></i>
        </button>
        <input type="text" id="aicaChatInput" placeholder="Ask IRA about this screen…" autocomplete="off" data-i18n-placeholder="assistant.placeholder">
        <button type="submit" aria-label="Send"><i class="bi bi-arrow-up"></i></button>
    </form>
</div>

<script>
window.AICA_PAGE = {{ (active_page or 'dashboard') | tojson }};
window.AICA_PATH = {{ (request.url.path if request else '/') | tojson }};
window.AICA_UI_MODE = {{ (ui_mode or 'org') | tojson }};
window.AICA_LANG = {{ (preferred_language or 'en') | tojson }};
</script>
<script src="/static/money.js?v=1"></script>
<script src="/static/download.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/i18n.js?v=4"></script>
<script src="/static/assistant.js?v=13"></script>
<script src="/static/update.js?v=3"></script>
<script src="/static/sidebar.js?v=3"></script>
