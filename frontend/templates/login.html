<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICA — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js?v=3"></script>
    <style>
        body { display: block; min-height: 100vh; }
        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background: radial-gradient(1200px 600px at 10% -10%, rgba(30,58,95,0.12), transparent),
                        radial-gradient(900px 500px at 100% 100%, rgba(15,23,42,0.06), transparent),
                        var(--background);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }
        .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .auth-brand i { font-size: 28px; color: var(--primary); }
        .pw-wrap { position: relative; }
        .pw-wrap .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            border: 0; background: none; color: var(--text-muted); cursor: pointer;
        }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-robot"></i>
            <h2 class="logo m-0" style="font-size: 28px;">AICA</h2>
        </div>
        <h1 class="h4 fw-bold mt-3 mb-1">Sign in to your organisation</h1>
        <p class="text-muted small mb-4">Sign in to open your organisation’s dashboard.</p>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="alert alert-success py-2 small">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/login" id="loginForm">
            <label class="form-label small text-muted">Email</label>
            <input type="email" name="email" class="form-control modern-input" required autocomplete="username" value="{{ email or '' }}">

            <label class="form-label small text-muted">Password</label>
            <div class="pw-wrap">
                <input type="password" name="password" id="password" class="form-control modern-input" required autocomplete="current-password">
                <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Show password"><i class="bi bi-eye" id="pwIcon"></i></button>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="remember" value="true" id="remember">
                <label class="form-check-label small" for="remember">Remember me for 30 days</label>
            </div>

            <button type="submit" class="btn modern-btn w-100" id="submitBtn">
                <span id="btnLabel">Sign in</span>
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            New business? <a href="/signup" class="fw-semibold">Create organisation</a>
        </p>
    </div>
</div>
<script>
function togglePw() {
    const el = document.getElementById('password');
    const icon = document.getElementById('pwIcon');
    const show = el.type === 'password';
    el.type = show ? 'text' : 'password';
    icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
}
document.getElementById('loginForm').addEventListener('submit', function () {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('btnLabel').innerText = 'Signing in…';
});
</script>
</body>
</html>
