<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICA — Choose interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js?v=3"></script>
    <style>
        .iface-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(56, 189, 248, 0.12), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(15, 23, 42, 0.08), transparent 45%),
                var(--bg, #f1f5f9);
        }
        .iface-panel { max-width: 920px; width: 100%; }
        .iface-brand { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.35rem; }
        .iface-lead { color: var(--muted, #64748b); margin-bottom: 2rem; }
        .iface-card {
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 18px;
            padding: 28px 24px;
            background: var(--card-bg, #fff);
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: left;
            width: 100%;
        }
        .iface-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
            border-color: #93c5fd;
        }
        .iface-card h3 { font-weight: 750; font-size: 1.25rem; margin: 12px 0 8px; }
        .iface-card p { color: var(--muted, #64748b); margin: 0; font-size: 0.95rem; line-height: 1.45; }
        .iface-icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #0f172a;
            background: rgba(56, 189, 248, 0.18);
        }
        .iface-card.pos .iface-icon { background: rgba(16, 185, 129, 0.18); color: #065f46; }
        .iface-meta { font-size: 0.85rem; color: var(--muted, #64748b); margin-top: 1.5rem; }
    </style>
</head>
<body>
<div class="iface-wrap">
    <div class="iface-panel text-center">
        <div class="iface-brand">AICA</div>
        <p class="iface-lead" data-i18n="iface.choose">Where do you want to start?</p>
        <div class="row g-4">
            <div class="col-md-6">
                <form method="POST" action="/select-interface">
                    <input type="hidden" name="mode" value="pos">
                    <button type="submit" class="iface-card pos">
                        <span class="iface-icon"><i class="bi bi-cart-check-fill"></i></span>
                        <h3 data-i18n="iface.posTitle">POS Interface</h3>
                        <p data-i18n="iface.posDesc">Point of Sale — billing, cart, product scanning and checkout.</p>
                    </button>
                </form>
            </div>
            <div class="col-md-6">
                <form method="POST" action="/select-interface">
                    <input type="hidden" name="mode" value="org">
                    <button type="submit" class="iface-card org">
                        <span class="iface-icon"><i class="bi bi-building"></i></span>
                        <h3 data-i18n="iface.orgTitle">Organization Interface</h3>
                        <p data-i18n="iface.orgDesc">Business Management — inventory, expenses, payroll, GST, analytics and administration.</p>
                    </button>
                </form>
            </div>
        </div>
        {% if auth_user %}
        <p class="iface-meta">{{ auth_user.full_name }} · {{ org.name if org else '' }} · <a href="/logout" data-i18n="nav.logout">Log out</a></p>
        {% endif %}
    </div>
</div>
<script>
window.AICA_LANG = {{ (preferred_language or 'en') | tojson }};
</script>
<script src="/static/i18n.js?v=4"></script>
</body>
</html>
