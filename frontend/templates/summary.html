<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AICA Summary</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap and Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js?v=3"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

{% include "partials/sidebar.html" %}


    <!-- MAIN CONTENT -->

    <div class="main-content fade-in-up">

        <h1 class="page-title mb-4" style="font-weight: 800; font-size: 36px;">Financial Summary</h1>


        <!-- SUMMARY CARDS -->
        <div class="summary-grid">
            <div class="summary-card sales-card">
                <p>Total Revenue</p>
                <h2>₹{{ total_sales }}</h2>
            </div>

            <a href="/tax_details" style="text-decoration: none;">
                <div class="summary-card gst-card">
                    <p>Total GST Collected</p>
                    <h2>₹{{ total_gst }}</h2>
                </div>
            </a>


            <div class="summary-card transaction-card">

                <p>Total Transactions</p>

                <h2>{{ transaction_count }}</h2>

            </div>

        </div>


        <!-- CHARTS -->
        <div class="chart-grid">
            <div class="chart-card">
                <h3>GST Distribution</h3>
                <div class="chart-container">
                    <canvas id="gstChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Sales Analytics</h3>
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Revenue Trend</h3>
                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>

    </div>


    <!-- CHART SCRIPT -->

    <script>

        const labels = JSON.parse('{{ gst_labels | tojson | safe }}');

        const gstData = JSON.parse('{{ gst_values | tojson | safe }}');

        const salesData = JSON.parse('{{ sales_values | tojson | safe }}');


        // GST CHART

        new Chart(document.getElementById("gstChart"), {

            type: "doughnut",

            data: {

                labels: labels,

                datasets: [{

                    label: "GST Amount (₹)",

                    data: gstData,

                    borderWidth: 2

                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });


        // SALES CHART

        new Chart(document.getElementById("salesChart"), {

            type: "bar",

            data: {

                labels: labels,

            datasets: [{
                    label: "Sales Amount",
                    data: salesData,
                    borderWidth: 2,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgb(54, 162, 235)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // REVENUE TREND (LINE)
        new Chart(document.getElementById("lineChart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Sales Trend",
                    data: salesData,
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: 'rgba(16, 185, 129, 0.2)',
                    borderColor: 'rgb(16, 185, 129)',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    </script>

</body>

</html>
