<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICA — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js?v=3"></script>
</head>
<body>
{% include "partials/sidebar.html" %}
<div class="main-content">
    <div class="hero-card">
        <div>
            <h1 class="hero-title" data-i18n="pages.profileTitle">Profile</h1>
            <p class="hero-subtitle" data-i18n="pages.profileSub">Your sign-in details</p>
        </div>
    </div>

    <div class="modern-card" style="max-width: 560px;">
        {% if error %}<div class="alert alert-warning py-2 small">{{ error }}</div>{% endif %}
        {% if saved %}<div class="alert alert-success py-2 small" data-i18n="profile.saved">Profile saved.</div>{% endif %}
        <form action="/api/profile" method="POST">
            <label class="form-label small text-muted" data-i18n="profile.fullName">Full name</label>
            <input class="form-control modern-input" name="full_name" required value="{{ auth_user.full_name if auth_user else '' }}">
            <label class="form-label small text-muted" data-i18n="profile.email">Email</label>
            <input class="form-control modern-input" type="email" name="email" required value="{{ auth_user.email if auth_user else '' }}">
            <label class="form-label small text-muted" data-i18n="profile.phone">Contact number</label>
            <input class="form-control modern-input" name="phone" value="{{ auth_user.phone if auth_user and auth_user.phone else '' }}">
            <label class="form-label small text-muted" data-i18n="profile.language">Language</label>
            <select class="form-select modern-input" name="preferred_language" id="profileLangSelect">
                <option value="en" {% if preferred_language == 'en' %}selected{% endif %}>English</option>
                <option value="kn" {% if preferred_language == 'kn' %}selected{% endif %}>ಕನ್ನಡ (Kannada)</option>
                <option value="hi" {% if preferred_language == 'hi' %}selected{% endif %}>हिन्दी (Hindi)</option>
            </select>
            <button class="btn modern-btn w-100" type="submit" data-i18n="profile.save">Save profile</button>
        </form>
        <p class="text-muted small mt-3 mb-0">Password is never shown. Organisation GST and address are under Organisation settings.</p>
    </div>
</div>
<script src="/static/explain.js"></script>
</body>
</html>
